<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Open Graph image. Authored, not generated: the grid, the hairlines and the
    single accent mark are the design system's own vocabulary, and a generated
    image would invent its own.

    The Documento Técnico metaphor: a drafting sheet in black ink, one sheet
    under the sheet, a drawing grid at 2% opacity, hairline rules, and exactly
    one fluorescent mark.
  -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left rule: the margin of the sheet -->
  <line x1="80" y1="72" x2="80" y2="558" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Name -->
  <text x="120" y="216" fill="#fafafa" font-family="Work Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="300" letter-spacing="5">RODRIGO</text>
  <text x="120" y="300" fill="#fafafa" font-family="Work Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="300" letter-spacing="5">AMARILLA</text>

  <!-- Role: the one accent mark -->
  <text x="122" y="366" fill="#fdff00" font-family="Work Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="5.5">BACKEND ENGINEER</text>

  <!-- Location -->
  <text x="122" y="412" fill="#a1a1a1" font-family="Work Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4">FORMOSA, ARGENTINA</text>

  <!-- Infrastructure topology, drawn in hairlines.
       The connectors meet the boxes at their edges, never through them. -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="1" fill="none">
    <line x1="784" y1="150" x2="860" y2="150"/>
    <line x1="944" y1="150" x2="1020" y2="150"/>
    <line x1="902" y1="174" x2="902" y2="262"/>
    <line x1="860" y1="286" x2="784" y2="286"/>
    <line x1="944" y1="286" x2="1020" y2="286"/>
    <line x1="1062" y1="310" x2="1062" y2="398"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1">
    <rect x="700" y="126" width="84" height="48" rx="4"/>
    <rect x="860" y="126" width="84" height="48" rx="4"/>
    <rect x="1020" y="126" width="84" height="48" rx="4"/>
    <rect x="700" y="262" width="84" height="48" rx="4"/>
    <rect x="860" y="262" width="84" height="48" rx="4"/>
    <rect x="1020" y="398" width="84" height="48" rx="4"/>
  </g>

  <!-- The selected node: the one accent in the diagram -->
  <rect x="1020" y="262" width="84" height="48" rx="4" fill="none" stroke="#fdff00" stroke-opacity="0.85" stroke-width="1.5"/>

  <!-- Bottom rule -->
  <line x1="120" y1="486" x2="1080" y2="486" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Stack -->
  <text x="120" y="528" fill="#a1a1a1" font-family="Work Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.6">JAVA · NODE · PYTHON · AWS · KUBERNETES · TERRAFORM</text>
</svg>
